[project]
name = "sarathi"
version = "0.1.0"
description = "sarathi -- the one you install: Yantra and its siblings, found and started together"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
# One dependency, and no sibling: each sibling lives in its own
# environment, so Sarathi runs them as programs and reads the JSON they
# print -- it imports none of them. cryptography is for `sarathi backup`
# alone (X25519 and AES-GCM, the same as Setu's locked folder).
dependencies = ["cryptography>=42"]

[project.scripts]
sarathi = "sarathi.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sarathi"]

[tool.ruff]
line-length = 100          # prose wraps near 79; this is the HARD ceiling
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
